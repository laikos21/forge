[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is supplied at runtime from app.config; this value is only a fallback
# for `alembic` invocations made without the application environment.
sqlalchemy.url = sqlite+pysqlite:///../data/forge.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# WARNING keeps normal migrations silent. Windows PowerShell treats anything a
# native process writes to stderr as an error record, so a chatty migration would
# make build.ps1 look like it failed.
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
